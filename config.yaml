    name: L'Usine Digitale
  - url: https://www.actuia.com/feed/
    name: ActuIA
  - url: https://www.numerama.com/feed/
    name: Numerama
  - url: https://www.lemonde.fr/pixels/rss_full.xml
    name: Le Monde Pixels

  # Énergie & nucléaire
  - url: https://www.sfen.org/feed/
    name: SFEN
  - url: https://www.revolution-energetique.com/feed/
    name: Révolution Énergétique
  - url: https://www.connaissancedesenergies.org/rss.xml
    name: Connaissance des Énergies
  - url: https://www.lemonde.fr/energies/rss_full.xml
