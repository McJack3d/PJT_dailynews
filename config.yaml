# dailynews configuration. Edit this file directly on GitHub to change your paper.
# Secrets (Kindle address, SMTP password) do NOT go here: they are GitHub Actions secrets.
# Delivery time is set in .github/workflows/daily.yml (cron, UTC).
#
# Keywords are matched case- and accent-insensitively ("réacteur" == "reacteur"),
# on whole words, against the title, summary and article text.

title: Le Quotidien
language: fr          # language of the issue (EPUB metadata)
market: fr-FR         # French-language Google News search, France edition

max_articles: 22      # whole issue (~45-60 min of reading)
max_per_section: 8    # per interest
max_age_hours: 30     # ignore older items
min_words: 200        # shorter extractions fall back to the summary + link

# Sections appear in this order. Each gets a Google News search (the `search` query)
# plus any matching items from the RSS feeds below.
interests:
  - name: Intelligence artificielle
    search: '"intelligence artificielle" OR "IA générative" OR LLM OR OpenAI OR Anthropic OR "Mistral AI" OR "modèle de langage"'
    keywords:
      - intelligence artificielle
      - IA
      - IA générative
      - LLM
      - modèle de langage
      - grand modèle de langage
      - apprentissage automatique
      - deep learning
      - réseau de neurones
      - agent IA
      - agents IA
      - OpenAI
      - ChatGPT
      - Anthropic
      - Claude
      - Mistral AI
      - Google DeepMind
      - Gemini
      - Meta AI
      - Llama
      - Nvidia
      - GPU
      - AI Act
      - datacenter
      - data center
      - centre de données

  - name: Énergie & nucléaire (SMR)
    search: '"petit réacteur modulaire" OR "petits réacteurs modulaires" OR "SMR nucléaire" OR "réacteur nucléaire" OR EPR2 OR "centrale nucléaire" OR "fusion nucléaire" OR "filière nucléaire"'
    keywords:
      - SMR
      - petit réacteur modulaire
      - petits réacteurs modulaires
      - réacteur modulaire
      - AMR
      - réacteur nucléaire
      - réacteurs nucléaires
      - nucléaire
      - centrale nucléaire
      - EPR
      - EPR2
      - Flamanville
      - EDF
      - Nuward
      - Framatome
      - Orano
      - CEA
      - Newcleo
      - Jimmy Energy
      - Calogena
      - Blue Capsule
      - Stellaria
      - Hexana
      - Thorizon
      - NuScale
      - Rolls-Royce SMR
      - GE Hitachi
      - BWRX-300
      - TerraPower
      - Kairos Power
      - Oklo
      - X-energy
      - fusion nucléaire
      - ITER
      - uranium
      - combustible nucléaire
      - AIEA
      - ASNR
      - France 2030
      - mix énergétique
      - réseau électrique
      - prix de l'électricité
      - RTE

  - name: Géopolitique
    # No Google News search here: it pulls in minor and fringe outlets. Only the
    # international desks below (Le Monde, Courrier International, France 24) feed it.
    discover: false
    keywords:
      - géopolitique
      - guerre
      - cessez-le-feu
      - Ukraine
      - Russie
      - Kremlin
      - Poutine
      - Chine
      - Pékin
      - Xi Jinping
      - Taïwan
      - OTAN
      - Union européenne
      - Commission européenne
      - Maison Blanche
      - Iran
      - Israël
      - Gaza
      - Moyen-Orient
      - Conseil de sécurité
      - ONU
      - G7
      - G20
      - sanctions contre
      - droits de douane
      - dissuasion nucléaire
      - sommet de l'OTAN
      - sommet du G7

# Hand-picked RSS feeds. Their items are only kept when they match a section above.
feeds:
